name: Build

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:
    branches: ['main']
permissions:
  contents: write
  pages: write
  issues: write
  id-token: write
  checks: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1

      - name: Git checkout for source code analysis
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm ci

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Generate assets
        run: npm run assets:sync

      - name: Run unit tests with coverage
        run: npm run test:unit:ci -- --reporter=default --reporter=junit --outputFile.junit=./test-results/junit.xml

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./test-results/junit.xml

      - name: Publish coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: ./coverage

  build:
    name: Build
    needs: test
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1

      - name: Git checkout for source code analysis
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm ci

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Generate assets
        run: npm run assets:sync

      - name: Run qa
        run: |
          npm run qa:lint
          npm run qa:duplication

      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cp package.json src/
          cp README.md src/
          npm run release -- --r git@github.com:Open3CL/engine.git
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      # `main` plutôt que le commit déclencheur : le commit de release, poussé par
      # semantic-release, contient les résultats de corpus marqués publiés.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      # Le site ne publie que le rapport de corpus : la racine y renvoie, ce qui garde
      # valides les liens existants vers /reports/corpus.
      - name: Rediriger la racine vers le rapport de corpus
        run: |
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="fr">
            <head>
              <meta charset="utf-8" />
              <title>Open3CL — Rapports de corpus</title>
              <meta http-equiv="refresh" content="0; url=./reports/corpus/" />
              <link rel="canonical" href="./reports/corpus/" />
            </head>
            <body>
              <a href="./reports/corpus/">Rapports de corpus Open3CL</a>
            </body>
          </html>
          HTML
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload dist repository
          path: 'dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
